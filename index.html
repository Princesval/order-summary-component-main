<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <main>
    <div id="container-img">
      <img src="images/illustration-hero.svg" alt="A person listing to music">
    </div>
    <div id="infos-div">
      <h1>Order Summary</h1>
      <p>
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>
      <div id="select-plan-div">
        <img src="images/icon-music.svg" alt="music icon">
        <div id="typeof-plan">
          <span id="time"><strong>Annual Plan</strong></span>
          <span id="price">$59.99/year</span>
        </div>
        <a href="#">Change</a>
      </div>
      <button type="submit" id="pay-btn">Proceed to Payment</button>
      <button type="reset" id="cancel-btn">Cancel Order</button>
    </div>
  </main>
  
  <footer class="attribution">
    <p>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://github.com/Princesval" target="_blank">João Vitor Princesval Caetano</a>.
    </p>
  </footer>
</body>
</html>
